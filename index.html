<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ドライブ席決めアプリ</title>
  <style>
    :root {
      --bg: #0f1923;
      --surface: #1a2636;
      --surface2: #243346;
      --accent: #4fc3f7;
      --accent2: #f06292;
      --text: #e8f0fe;
      --text-muted: #7a93b0;
      --car-a: #1e3a5f;
      --car-b: #3a1e3f;
      --car-a-border: #4fc3f7;
      --car-b-border: #ce93d8;
      --radius: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ===== HEADER ===== */
    header {
      background: linear-gradient(135deg, #0f1923 0%, #1a2636 100%);
      border-bottom: 1px solid var(--surface2);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header .logo {
      font-size: 22px;
    }
    header h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    /* ===== TAB ===== */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--surface2);
    }
    .tab {
      flex: 1;
      padding: 14px 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--surface2);
    }

    /* ===== PAGES ===== */
    .page { display: none; padding: 20px 16px; }
    .page.active { display: block; }

    /* ===== SECTION TITLE ===== */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
      margin-top: 24px;
    }
    .section-title:first-child { margin-top: 0; }

    /* ===== PERSON CARD ===== */
    .person-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--surface2);
    }
    .person-card.driver {
      border-left: 3px solid var(--accent);
    }

    .avatar-wrap {
      position: relative;
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      overflow: hidden;
      border: 2px solid var(--surface2);
      transition: border-color 0.2s;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-upload-hint {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 2px;
    }
    .avatar:hover { border-color: var(--accent); }

    .driver-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: var(--accent);
      color: #0f1923;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 20px;
    }

    .person-info { flex: 1; min-width: 0; }
    .person-role {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .name-input {
      background: var(--surface2);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      padding: 8px 10px;
      width: 100%;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .name-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ===== SHUFFLE PAGE ===== */
    .shuffle-hero {
      text-align: center;
      padding: 30px 0 20px;
    }
    .shuffle-hero p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .shuffle-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--accent), #0288d1);
      color: #0f1923;
      font-size: 17px;
      font-weight: 800;
      padding: 16px 40px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(79,195,247,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: inherit;
      letter-spacing: 0.02em;
    }
    .shuffle-btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 12px rgba(79,195,247,0.25);
    }
    .shuffle-btn .dice { font-size: 22px; }

    /* ===== RESULT ===== */
    #result { display: none; margin-top: 8px; }

    .result-title {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }

    /* ===== CAR DIAGRAM ===== */
    .car-diagram {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 16px 24px;
      margin-bottom: 16px;
      border: 1px solid var(--surface2);
      position: relative;
    }
    .car-diagram.car-a { border-top: 3px solid var(--car-a-border); }
    .car-diagram.car-b { border-top: 3px solid var(--car-b-border); }

    .car-label {
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 18px;
      letter-spacing: 0.06em;
    }
    .car-a .car-label { color: var(--car-a-border); }
    .car-b .car-label { color: var(--car-b-border); }

    /* Car shape top-view */
    .car-body {
      position: relative;
      margin: 0 auto;
      width: 240px;
    }

    /* Road direction indicator */
    .road-arrow {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.08em;
    }

    .car-outline {
      background: linear-gradient(180deg,
        rgba(79,195,247,0.07) 0%,
        rgba(79,195,247,0.03) 100%
      );
      border: 1.5px solid rgba(79,195,247,0.25);
      border-radius: 28px 28px 20px 20px;
      padding: 14px 10px 18px;
      position: relative;
    }
    .car-b .car-outline {
      background: linear-gradient(180deg,
        rgba(206,147,216,0.07) 0%,
        rgba(206,147,216,0.03) 100%
      );
      border-color: rgba(206,147,216,0.25);
    }

    /* windshield */
    .windshield {
      height: 6px;
      background: rgba(79,195,247,0.18);
      border-radius: 4px;
      margin: 0 16px 14px;
    }
    .car-b .windshield { background: rgba(206,147,216,0.18); }

    .seat-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 8px;
      align-items: center;
    }
    .seat-row.back-row { margin-top: 10px; }

    /* rear windshield */
    .rear-glass {
      height: 5px;
      background: rgba(79,195,247,0.12);
      border-radius: 4px;
      margin: 8px 16px 0;
    }
    .car-b .rear-glass { background: rgba(206,147,216,0.12); }

    /* center tunnel divider */
    .center-divide {
      width: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .divide-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--surface2);
    }

    /* SEAT SLOT */
    .seat-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 80px;
    }
    .seat-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid var(--surface2);
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: border-color 0.3s;
    }
    .car-a .seat-icon { border-color: rgba(79,195,247,0.4); }
    .car-b .seat-icon { border-color: rgba(206,147,216,0.4); }
    .seat-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .seat-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 76px;
    }
    .seat-label {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* steering wheel */
    .steering {
      font-size: 20px;
      opacity: 0.5;
    }

    /* animation */
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    .seat-icon.animated { animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }

    /* ===== MISSING WARNING ===== */
    .warning {
      background: rgba(240,98,146,0.12);
      border: 1px solid rgba(240,98,146,0.4);
      border-radius: var(--radius-sm);
      color: var(--accent2);
      font-size: 13px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: none;
    }

    /* ===== HIDDEN FILE INPUT ===== */
    input[type="file"] { display: none; }

  </style>
</head>
<body>

<header>
  <span class="logo">🚗</span>
  <h1>ドライブ席決めアプリ</h1>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('settings')">👤 メンバー設定</div>
  <div class="tab" onclick="switchTab('shuffle')">🎲 席シャッフル</div>
</div>

<!-- ===== SETTINGS PAGE ===== -->
<div id="page-settings" class="page active">

  <div class="section-title">🚙 車A ドライバー</div>
  <div id="card-0"></div>

  <div class="section-title">🚙 車B ドライバー</div>
  <div id="card-1"></div>

  <div class="section-title">👥 同乗者（6名）</div>
  <div id="card-2"></div>
  <div id="card-3"></div>
  <div id="card-4"></div>
  <div id="card-5"></div>
  <div id="card-6"></div>
  <div id="card-7"></div>

</div>

<!-- ===== SHUFFLE PAGE ===== -->
<div id="page-shuffle" class="page">
  <div class="shuffle-hero">
    <p>ボタンを押すと、6人の同乗者をランダムに<br>2台の車に振り分けます。</p>
    <button class="shuffle-btn" onclick="doShuffle()">
      <span class="dice">🎲</span> シャッフル！
    </button>
  </div>

  <div class="warning" id="warning">⚠️ 名前が入力されていないメンバーがいます。設定画面で全員の名前を入力してください。</div>

  <div id="result">
    <div class="result-title">🎉 席が決まりました！</div>

    <!-- CAR A -->
    <div class="car-diagram car-a">
      <div class="car-label">🚙 車 A</div>
      <div class="car-body">
        <div class="road-arrow">▲ 進行方向</div>
        <div class="car-outline">
          <div class="windshield"></div>

          <!-- Front row -->
          <div class="seat-row">
            <div class="seat-slot" id="a-driver">
              <div class="seat-icon"><span>👤</span></div>
              <div class="seat-name">—</div>
              <div class="seat-label">ドライバー</div>
            </div>
            <div class="center-divide">
              <div class="steering">🕹️</div>
            </div>
            <div class="seat-slot" id="a-front">
              <div class="seat-icon"><span>👤</span></div>
              <div class="seat-name">—</div>
              <div class="seat-label">助手席</div>
            </div>
          </div>

          <!-- Back row -->
          <div class="seat-row back-row">
            <div class="seat-slot" id="a-back-l">
              <div class="seat-icon"><span>👤</span></div>
              <div class="seat-name">—</div>
              <div class="seat-label">後部左</div>
            </div>
            <div class="center-divide">
              <div class="divide-dot"></div>
              <div class="divide-dot"></div>
              <div class="divide-dot"></div>
            </div>
            <div class="seat-slot" id="a-back-r">
              <div class="seat-icon"><span>👤</span></div>
              <div class="seat-name">—</div>
              <div class="seat-label">後部右</div>
            </div>
          </div>

          <div class="rear-glass"></div>
        </div>
      </div>
    </div>

    <!-- CAR B -->
    <div class="car-diagram car-b">
      <div class="car-label">🚙 車 B</div>
      <div class="car-body">
        <div class="road-arrow">▲ 進行方向</div>
        <div class="car-outline">
          <div class="windshield"></div>

          <!-- Front row -->
          <div class="seat-row">
            <div class="seat-slot" id="b-driver">
              <div class="seat-icon"><span>👤</span></div>
              <div class="seat-name">—</div>
              <div class="seat-label">ドライバー</div>
            </div>
            <div class="center-divide">
              <div class="steering">🕹️</div>
            </div>
            <div class="seat-slot" id="b-front">
              <div class="seat-icon"><span>👤</span></div>
              <div class="seat-name">—</div>
              <div class="seat-label">助手席</div>
            </div>
          </div>

          <!-- Back row -->
          <div class="seat-row back-row">
            <div class="seat-slot" id="b-back-l">
              <div class="seat-icon"><span>👤</span></div>
              <div class="seat-name">—</div>
              <div class="seat-label">後部左</div>
            </div>
            <div class="center-divide">
              <div class="divide-dot"></div>
              <div class="divide-dot"></div>
              <div class="divide-dot"></div>
            </div>
            <div class="seat-slot" id="b-back-r">
              <div class="seat-icon"><span>👤</span></div>
              <div class="seat-name">—</div>
              <div class="seat-label">後部右</div>
            </div>
          </div>

          <div class="rear-glass"></div>
        </div>
      </div>
    </div>

  </div><!-- #result -->
</div><!-- page-shuffle -->

<!-- Hidden file inputs -->
<input type="file" id="file-input" accept="image/*">

<script>
// ===================================================
// STATE
// ===================================================
const DEFAULT_MEMBERS = [
  { name: "ドライバーA", role: "車Aドライバー", emoji: "🧑‍✈️", img: null },
  { name: "ドライバーB", role: "車Bドライバー", emoji: "🧑‍✈️", img: null },
  { name: "メンバー1",  role: "同乗者",        emoji: "😀", img: null },
  { name: "メンバー2",  role: "同乗者",        emoji: "😄", img: null },
  { name: "メンバー3",  role: "同乗者",        emoji: "😎", img: null },
  { name: "メンバー4",  role: "同乗者",        emoji: "🥳", img: null },
  { name: "メンバー5",  role: "同乗者",        emoji: "😊", img: null },
  { name: "メンバー6",  role: "同乗者",        emoji: "🤩", img: null },
];

// Load from localStorage or use defaults
const members = loadMembers();

let currentUploadIndex = null;

// ===================================================
// STORAGE
// ===================================================
function loadMembers() {
  try {
    const saved = localStorage.getItem("drive-members");
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return DEFAULT_MEMBERS.map(m => ({...m}));
}

function saveMembers() {
  try {
    localStorage.setItem("drive-members", JSON.stringify(members));
  } catch(e) {}
}

// ===================================================
// RENDER SETTINGS
// ===================================================
function renderCards() {
  members.forEach((m, i) => {
    const container = document.getElementById("card-" + i);
    if (!container) return;
    const isDriver = i < 2;

    const imgContent = m.img
      ? `<img src="${m.img}" alt="${m.name}">`
      : `<span>${m.emoji}</span>`;

    container.innerHTML = `
      <div class="person-card ${isDriver ? 'driver' : ''}">
        <div>
          <div class="avatar-wrap">
            <div class="avatar" onclick="openUpload(${i})">${imgContent}</div>
            ${isDriver ? '<div class="driver-badge">運転</div>' : ''}
          </div>
          <div class="avatar-upload-hint">タップで変更</div>
        </div>
        <div class="person-info">
          <div class="person-role">${m.role}</div>
          <input
            class="name-input"
            type="text"
            value="${m.name}"
            placeholder="名前を入力"
            oninput="updateName(${i}, this.value)"
            maxlength="10"
          />
        </div>
      </div>
    `;
  });
}

function updateName(index, value) {
  members[index].name = value;
  saveMembers();
}

// ===================================================
// IMAGE UPLOAD
// ===================================================
function openUpload(index) {
  currentUploadIndex = index;
  const fileInput = document.getElementById("file-input");
  fileInput.value = "";
  fileInput.click();
}

document.getElementById("file-input").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file || currentUploadIndex === null) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    members[currentUploadIndex].img = ev.target.result;
    saveMembers();
    renderCards();
  };
  reader.readAsDataURL(file);
});

// ===================================================
// TAB SWITCH
// ===================================================
function switchTab(tab) {
  document.querySelectorAll(".tab").forEach((el, i) => {
    el.classList.toggle("active", (i === 0 && tab === "settings") || (i === 1 && tab === "shuffle"));
  });
  document.getElementById("page-settings").classList.toggle("active", tab === "settings");
  document.getElementById("page-shuffle").classList.toggle("active", tab === "shuffle");
}

// ===================================================
// SHUFFLE
// ===================================================
function doShuffle() {
  // Check all names are filled
  const allNamed = members.every(m => m.name.trim() !== "");
  const warning = document.getElementById("warning");
  if (!allNamed) {
    warning.style.display = "block";
    document.getElementById("result").style.display = "none";
    return;
  }
  warning.style.display = "none";

  // Shuffle passengers (index 2–7)
  const passengers = [2, 3, 4, 5, 6, 7];
  for (let i = passengers.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [passengers[i], passengers[j]] = [passengers[j], passengers[i]];
  }

  // Assignment order (per spec):
  // Car A front (助手席), Car B back-left, Car B back-right,
  // Car A back-left, Car A back-right, Car B front (助手席)
  const slots = [
    { id: "a-front",  label: "助手席" },
    { id: "b-back-l", label: "後部左" },
    { id: "b-back-r", label: "後部右" },
    { id: "a-back-l", label: "後部左" },
    { id: "a-back-r", label: "後部右" },
    { id: "b-front",  label: "助手席" },
  ];

  // Fixed: drivers
  renderSeat("a-driver", members[0]);
  renderSeat("b-driver", members[1]);

  // Passengers
  slots.forEach((slot, i) => {
    renderSeat(slot.id, members[passengers[i]]);
  });

  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderSeat(slotId, member) {
  const slot = document.getElementById(slotId);
  if (!slot) return;

  const iconEl = slot.querySelector(".seat-icon");
  const nameEl = slot.querySelector(".seat-name");

  // Animation
  iconEl.classList.remove("animated");
  void iconEl.offsetWidth; // reflow
  iconEl.classList.add("animated");

  iconEl.innerHTML = member.img
    ? `<img src="${member.img}" alt="${member.name}">`
    : `<span>${member.emoji}</span>`;

  nameEl.textContent = member.name || "—";
}

// ===================================================
// INIT
// ===================================================
renderCards();
</script>
</body>
</html>
